<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Expense Tracker</title>
  <!--
    PLACEHOLDER HTML — Member 1 (Backend & Integration)
    =====================================================
    This file provides the bare-minimum DOM structure so that
    app.js (fetch/integration layer) can target elements by ID.

    Member 2 (Frontend) will replace this file with the fully
    styled version on their branch. The element IDs below MUST
    be preserved so the JS integration continues to work after merge.
  -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Mini Expense Tracker</h1>

  <!-- ── Total Display ─────────────────────────── -->
  <section id="total-section">
    <p>Total Expenses: <span id="total-amount">₹0.00</span></p>
  </section>

  <!-- ── Add Expense Form ───────────────────────── -->
  <section id="form-section">
    <h2>Add Expense</h2>
    <form id="expense-form">

      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="e.g. Lunch" required />

      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" name="amount" placeholder="e.g. 80" min="0.01" step="0.01" required />

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">-- Select Category --</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Shopping">Shopping</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Health">Health</option>
        <option value="Education">Education</option>
        <option value="Utilities">Utilities</option>
        <option value="Other">Other</option>
      </select>

      <label for="date">Date</label>
      <input type="date" id="date" name="date" required />

      <button type="submit" id="submit-btn">Add Expense</button>
    </form>

    <!-- Validation / server error messages shown here -->
    <p id="form-error" style="color:red;display:none;"></p>
    <p id="form-success" style="color:green;display:none;"></p>
  </section>

  <!-- ── Expense List ───────────────────────────── -->
  <section id="list-section">
    <h2>All Expenses</h2>
    <!-- app.js populates this tbody -->
    <table id="expense-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="expense-list">
        <!-- Rows injected by app.js -->
      </tbody>
    </table>

    <p id="no-expenses-msg" style="display:none;">No expenses yet. Add one above!</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
